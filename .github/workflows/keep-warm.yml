name: Keep the demo warm

# Both Render services sleep after fifteen idle minutes and take roughly a
# minute to come back. That minute lands on whoever opens the demo, which on
# this project is usually a recruiter following a link from the portfolio.
#
# Pinging every ten minutes keeps them under the fifteen minute threshold.
#
# THE WINDOW IS DELIBERATELY NARROW. Render's free tier bills instance-hours
# across the whole account, not per service. Keeping something awake around
# the clock costs about 730 hours a month, which is almost the entire free
# allowance on its own, and this account also runs the sales call demo and
# the ParkingBae API.
#
#   13 hours x 5 weekdays  = 65h/week ~= 282 instance-hours per service/month
#   two services                      ~= 563 of roughly 750
#
# That leaves roughly 187 hours for the ParkingBae API and the sales call demo
# to wake on demand, which is ample since they only run while someone is
# looking at them. Widening the window or adding a third service to the matrix
# will push the account over, and Render suspends free services for the rest
# of the month once the allowance is gone. Check usage in the dashboard before
# changing the schedule.
#
# Times below are UTC. The window is 08:00-20:00 in Melbourne, which is
# UTC+10 in winter. Melbourne moves to UTC+11 for daylight saving in October,
# so the window drifts an hour later for part of the year. Not worth the
# complexity of correcting: the edges are quiet either way.

on:
  schedule:
    # 22:00-23:59 UTC Sun-Thu = 08:00-09:59 Melbourne Mon-Fri
    - cron: "*/10 22,23 * * 0-4"
    # 00:00-10:59 UTC Mon-Fri = 10:00-20:59 Melbourne Mon-Fri
    - cron: "*/10 0-10 * * 1-5"
  # So the schedule can be tested without waiting for the next slot.
  workflow_dispatch:

# A slow reply means the service was asleep and is now waking, which is the
# whole point of the run. Only a total failure is worth a red mark.
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            url: https://comment-sanitizer-api.onrender.com/health
          - name: Sanitiser
            url: https://comment-sanitizer-nlp.onrender.com/health
    steps:
      - name: Ping ${{ matrix.name }}
        run: |
          for attempt in 1 2 3; do
            start=$(date +%s)
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "${{ matrix.url }}" || echo "000")
            elapsed=$(( $(date +%s) - start ))

            if [ "$code" = "200" ]; then
              echo "${{ matrix.name }}: 200 in ${elapsed}s (attempt $attempt)"
              exit 0
            fi

            echo "${{ matrix.name }}: got $code after ${elapsed}s (attempt $attempt)"
            sleep 15
          done

          echo "::error::${{ matrix.name }} did not return 200 after 3 attempts"
          exit 1
